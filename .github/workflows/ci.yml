name: CI Gate Tests

on:
  push:
    branches: [ main, feat-* ]
  pull_request:
    branches: [ main ]

jobs:
  gate-tests:
    name: Run Phase Gates (DGX Spark ARM64 Self-Hosted)
    runs-on: [self-hosted, Linux, ARM64, dgx-spark, agy-easy-install]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: command -v shellcheck >/dev/null 2>&1 || (sudo -n apt-get update && sudo -n apt-get install -y shellcheck) || true

      - name: Run build script
        run: ./build.sh

      - name: Execute Phase Gate Runner
        run: bash tests/run_gates.sh --phase all
