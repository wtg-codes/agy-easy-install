name: CI Gate Tests

on:
  push:
    branches: [ main, feat-* ]
  pull_request:
    branches: [ main ]

# Only PR runs are cancelled by newer pushes; main branch runs complete in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; elevate only on jobs that require write scopes.
permissions:
  contents: read

jobs:
  # Self-hosted runners never execute code from fork PRs on a public repo:
  # untrusted fork PRs fall back to GitHub-hosted Ubuntu runners.
  gate-tests:
    name: Run Phase Gates (DGX Spark ARM64 Self-Hosted)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64","dgx-spark","agy-easy-install"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install shellcheck and test dependencies
        run: |
          command -v shellcheck >/dev/null 2>&1 || (sudo -n apt-get update && sudo -n apt-get install -y shellcheck) || true
          python3 -c "import requests" 2>/dev/null || python3 -m pip install --user --break-system-packages -r requirements.txt 2>/dev/null || pip3 install -r requirements.txt || true

      - name: Run build script
        run: ./build.sh

      - name: Execute Phase Gate Runner
        run: bash tests/run_gates.sh --phase all
