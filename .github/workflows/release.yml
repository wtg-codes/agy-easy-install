name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: [self-hosted, Linux, ARM64, dgx-spark, agy-easy-install]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --user --break-system-packages -r requirements.txt 2>/dev/null || pip3 install -r requirements.txt || true
          command -v shellcheck >/dev/null 2>&1 || (sudo -n apt-get update && sudo -n apt-get install -y shellcheck) || true

      - name: Run Phase Gate Tests
        run: bash tests/run_gates.sh --phase all

      - name: Build standalone manager script
        run: |
          ./build.sh
          shellcheck -e SC1091,SC2162 antigravity-manager.sh

      - name: Generate Checksums
        run: |
          sha256sum antigravity-manager.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" antigravity-manager.sh SHA256SUMS \
            --title "Release $TAG" \
            --generate-notes \
            --latest
