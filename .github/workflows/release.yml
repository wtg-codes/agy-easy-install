name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run Phase Gate Tests
        run: bash tests/run_gates.sh --phase all

      - name: Build standalone manager script
        run: |
          ./build.sh
          shellcheck -e SC1091,SC2162 antigravity-manager.sh

      - name: Generate Checksums
        run: |
          sha256sum antigravity-manager.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" antigravity-manager.sh SHA256SUMS \
            --title "Release $TAG" \
            --generate-notes \
            --latest
